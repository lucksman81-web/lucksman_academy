<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title> Home page - LUCKSMAN's SPORTS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .video-container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      .bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit:cover;
      }

      .text {
        position: relative;
        z-index: 1;
        color: white;
        text-align: center;
        font-size: 8vh;
        margin-top: 40vh;
      }

      .top-right {
        font-size: 25px;
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 29px;
        z-index: 10;
      }

      .top-right a {
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      .top-right a:hover {
        color: red;
        text-decoration: none;
      }

      .dropdown {
        position: relative;
        display: inline-block;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        background-color: rgba(0, 0, 0, 0.8);
        border-radius: 4px;
      }

      .dropdown-content a {
        color: white;
        padding: 12px 16px;
        font-size: 18px;
        display: block;
      }

      .dropdown-content a:hover {
        background-color: #359FA0;
        color: white;
        text-decoration: none;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }
    </style>
  </head>
  <body style="background-color: skyblue">
    <div class="video-container">
      <h1 class="text">LUCKSMAN's SPORTS🚀</h1>

      <div class="top-right">
        <a href="#">HOME</a>
        <a
          href="about.html"
          >ABOUT</a
        >

        <div class="dropdown">
          <a class="morethings" href="#">PROGRAMMES</a>
          <div class="dropdown-content">`
            <a
              href="kids.html"
              >KIDS PROGRAMMES</a
            >
            <a
              href="youth.html"
              >YOUTH PROGRAMMES</a
            >

            <a
              href="admission.html"
              >ADMISSION FORM</a
            >
          </div>
        </div>
        <a
          href="training.html"
          >TRAINING</a
        >

        <a
          href="cantact.html"
          >CONTACT US</a
        >
        <link
          rel="stylesheet"
          href="style.css"
        />
      </div>

      <div>
        <video
          autoplay
          loop
          muted
          playsinline
          class="bg-video"
          src="videoplayback.webm"
        ></video>
      </div>
    </div>
  </body>
</html>
