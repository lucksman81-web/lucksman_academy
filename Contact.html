<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>

    <style>
      * {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #e8c9d4;
        margin: 0;
        padding: 20px;
      }

      
      .menu {
        position: absolute;
        top: 20px;
        right: 40px;
        display: flex;
        gap: 30px;
      }

      .menu a {
        text-decoration: none;
        color: black;
        font-weight: bold;
        font-size: 25px;
      }

      .menu a:hover {
        color: red;
      }

      .dropdown {
        position: relative;
        display: inline-block;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        background-color: rgb(255, 232, 196);
        top: 100%;
        border-radius: 8px;
      }

      .dropdown-content a {
        color: black;
        padding: 12px 16px;
        font-size: 18px;
        display: block;
      }

      .dropdown-content a:hover {
        background-color: #e8c9d4;
        text-decoration: none;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }
      .main {
        width: 50%;
        padding: 20px;
        margin-top: 60px;
      }

      .title {
        font-size: 38px;
        text-align: center;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 25px;
      }

      .card {
        background: white;
        padding: 40px;
        border-radius: 16px;
      }

      .card p {
        text-align: center;
        font-weight: 700;
      }

      .heading {
        margin-bottom: 30px;
        font-size: 28px;
        text-align: center;
      }

      .box {
        margin-bottom: 20px;
      }

      .field {
        width: 100%;
        height: 65px;
        padding: 15px;
        border: 2px solid black;
        border-radius: 12px;
        font-size: 16px;
      }

      .btn {
        width: 100%;
        height: 65px;
        background: lightskyblue;
        border: 2px solid black;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn:hover {
        background: #0369a1;
        color: white;
      }

      .link-text {
        margin-top: 25px;
        text-align: center;
        color: #64748b;
      }

      .link-text a {
        color: #0284c7;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    
    <div class="menu">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>

      <div class="dropdown">
        <a href="#">PROGRAMMES</a>
        <div class="dropdown-content">
          <a href="kids.html">KIDS PROGRAMMES</a>
          <a href="youth.html">YOUTH PROGRAMMES</a>
        </div>
      </div>

      <a href="training.html">TRAINING</a>
      <a href="Contact.html">CONTACT</a>
    </div>

    <div class="main">
      <h3 class="title">LUCKSMAN'S SPORTS</h3>

      <div class="card">
        <p>FOR MORE DETAILS</p>
        <h2 class="heading">Register Here</h2>

        <form onsubmit="sendMail(event)">
          <div class="box">
            <input
              type="text"
              name="name"
              class="field"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="box">
            <input
              type="text"
              name="sports"
              class="field"
              list="sports-options"
              placeholder="What sports do you like?"
            />
            <datalist id="sports-options">
              <option value="Volleyball"></option>
              <option value="Football"></option>
              <option value="Cricket"></option>
              <option value="Kabaddi"></option>
              <option value="Athletics"></option>
              <option value="Basketball"></option>
            </datalist>
          </div>

          <div class="box">
            <input
              type="tel"
              name="contact"
              class="field"
              placeholder="Enter your Contact"
            />
          </div>

          <div class="box">
            <input
              type="text"
              name="feedback"
              class="field"
              placeholder="Enter your feedback"
            />
          </div>

          <div class="box">
            <input type="submit" class="btn" value="Submit" />
          </div>
        </form>

        <div class="link-text">
          Go to Home Page?
          <a href="index.html">Return Back</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
      emailjs.init("57e_UJYVw3Ug7Kwd6");

      function sendMail(event) {
        event.preventDefault();

        emailjs
          .sendForm("service_msxyo2k", "template_irx08pc", event.target)
          .then(
            function () {
              alert("Message sent successfully!");
              event.target.reset();
            },
            function (error) {
              alert("Failed to send message");
              console.error(error);
            },
          );
      }
    </script>
  </body>
</html>
